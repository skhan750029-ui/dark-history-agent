name: Daily Documentary + Shorts

on:
  schedule:
    - cron: "13 15 * * *"   # ~16:13 UK summer time; Shorts publish ~4h and ~9h later
  workflow_dispatch:
    inputs:
      privacy:
        description: "public / unlisted / private"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube? (no = test run, video only in Artifacts)"
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: write

concurrency:
  group: video-agent
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          pip install -q pillow
          # Anton: free bold caption font (SIL Open Font License) from the Google Fonts repository
          mkdir -p ~/.local/share/fonts
          curl -fsSL -o ~/.local/share/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || echo "Anton font not downloaded - using DejaVu Sans"
          fc-cache -f >/dev/null
      - name: Make and upload documentary + shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Dark History' }}
          PRIVACY: ${{ inputs.privacy || vars.PRIVACY || 'public' }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_RATE: ${{ vars.TTS_RATE }}
          LONG_MINUTES: ${{ vars.LONG_MINUTES || '11' }}
        run: python agent/studio.py ${{ inputs.upload == 'no' && '--no-upload' || '' }}
      - name: Save topic list and log
        if: always()
        # Re-applies this run's data on top of the newest branch instead of rebasing, so a run that started
        # from an older commit can't fail on the preview image: log lines from both sides are kept.
        run: |
          git config user.name "dark-history-agent"
          git config user.email "agent@users.noreply.github.com"
          rm -rf /tmp/run-data && cp -r data /tmp/run-data
          for try in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            for f in topics_done.txt upload_log.csv; do
              [ -f "/tmp/run-data/$f" ] || continue
              touch "data/$f"
              grep -vxF -f "data/$f" "/tmp/run-data/$f" >> "data/$f" || true
            done
            [ -d /tmp/run-data/previews ] && mkdir -p data/previews && cp /tmp/run-data/previews/* data/previews/
            git add data/
            git diff --cached --quiet && break
            git commit -q -m "Log daily video" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 10
          done
      - name: Keep a copy of the videos (5 days)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-videos
          path: out/
          retention-days: 5
