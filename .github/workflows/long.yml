name: Daily Documentary + Shorts

on:
  schedule:
    - cron: "13 15 * * *"   # ~16:13 UK summer time; Shorts publish ~4h and ~9h later
  workflow_dispatch:
    inputs:
      privacy:
        description: "public / unlisted / private"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube? (no = test run, video only in Artifacts)"
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: write

concurrency:
  group: video-agent
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          pip install -q pillow
      - name: Make and upload documentary + shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Dark History' }}
          PRIVACY: ${{ inputs.privacy || vars.PRIVACY || 'public' }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_RATE: ${{ vars.TTS_RATE }}
          LONG_MINUTES: ${{ vars.LONG_MINUTES || '11' }}
        run: python agent/studio.py ${{ inputs.upload == 'no' && '--no-upload' || '' }}
      - name: Save topic list and log
        if: always()
        run: |
          git config user.name "dark-history-agent"
          git config user.email "agent@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "Log daily video" && git pull --rebase && git push)
      - name: Keep a copy of the videos (5 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-videos
          path: out/
          retention-days: 5
