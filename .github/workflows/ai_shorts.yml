name: Everyday AI Easy - 2 Shorts

# Separate channel and separate bot (agent/ai_shorts.py). Dark History's workflow is untouched.
on:
  schedule:
    # 10:53 UTC; GitHub usually starts it ~30-40 min late -> uploads ~11:30 UTC (4:30 PM PKT), Shorts publish
    # ~5 PM and ~9 PM PKT (8 AM / 12 PM New York). Dark History runs ~15:13 UTC.
    - cron: "53 10 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "public / unlisted / private"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube? (no = test run, videos only in Artifacts)"
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  contents: write

concurrency:
  group: ai-shorts-agent
  cancel-in-progress: false

jobs:
  make-and-upload:
    # Real uploads are OFF until the owner approves the new format: set the repository variable
    # AI_UPLOAD = on (Settings -> Secrets and variables -> Actions -> Variables). Until then the daily
    # schedule is skipped and manual runs never upload, whatever the "upload" input says.
    if: github.event_name != 'schedule' || vars.AI_UPLOAD == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          pip install -q pillow playwright
          # real browser to open each tool's official website (verify + screenshot)
          python -m playwright install --with-deps chromium
          pip install -q edge-tts || echo "edge-tts not installed - no backup voice"
          pip install -q faster-whisper || echo "faster-whisper not installed - captions use estimated timing"
          # Poppins: clean, friendly free font (SIL Open Font License) for cards and captions
          mkdir -p ~/.local/share/fonts
          for f in Poppins-Bold Poppins-SemiBold; do
            curl -fsSL -o ~/.local/share/fonts/$f.ttf https://github.com/google/fonts/raw/main/ofl/poppins/$f.ttf || echo "$f not downloaded"
          done
          fc-cache -f >/dev/null
      - name: Make and upload Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GOOGLE_TTS_KEY: ${{ secrets.AI_GOOGLE_TTS_KEY || secrets.GOOGLE_TTS_KEY }}
          # same Google Cloud project / OAuth client as Dark History, only the channel's refresh token differs
          AI_YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          AI_YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          AI_YT_REFRESH_TOKEN: ${{ secrets.AI_YT_REFRESH_TOKEN }}
          AI_SHORTS_COUNT: ${{ vars.AI_SHORTS_COUNT || '2' }}  # 2 a day keeps the shared daily YouTube quota safe
          CHANNEL_NAME: ${{ vars.AI_CHANNEL_NAME || 'Everyday AI Easy' }}
          PRIVACY: ${{ inputs.privacy || vars.AI_PRIVACY || 'public' }}
          AI_TTS_VOICE: ${{ vars.AI_TTS_VOICE }}
          AI_TTS_VOICE_B: ${{ vars.AI_TTS_VOICE_B }}
          AI_TTS_RATE: ${{ vars.AI_TTS_RATE }}
          AI_EDGE_VOICE: ${{ vars.AI_EDGE_VOICE }}
          AI_EDGE_VOICE_B: ${{ vars.AI_EDGE_VOICE_B }}
          AI_LABEL: ${{ vars.AI_LABEL }}
        # (an empty string counts as false in GitHub expressions, so the flag must be the "true" branch)
        run: python agent/ai_shorts.py ${{ (vars.AI_UPLOAD != 'on' || inputs.upload == 'no') && '--no-upload' || '' }}
      - name: Save topic list and log
        if: always()
        # same safe re-apply as Dark History: this run's data on top of the newest branch, both sides' lines kept
        run: |
          git config user.name "everyday-ai-agent"
          git config user.email "agent@users.noreply.github.com"
          rm -rf /tmp/ai-data && mkdir -p data/ai && cp -r data/ai /tmp/ai-data
          for try in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            mkdir -p data/ai
            for f in topics_done.txt upload_log.csv hooks.csv; do
              [ -f "/tmp/ai-data/$f" ] || continue
              touch "data/ai/$f"
              grep -vxF -f "data/ai/$f" "/tmp/ai-data/$f" >> "data/ai/$f" || true
            done
            [ -d /tmp/ai-data/previews ] && mkdir -p data/ai/previews && cp /tmp/ai-data/previews/* data/ai/previews/
            git add data/ai/
            git diff --cached --quiet && break
            git commit -q -m "Log Everyday AI Easy shorts" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 10
          done
      - name: Keep a copy of the videos (5 days)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-shorts
          path: out/ai/
          retention-days: 5
